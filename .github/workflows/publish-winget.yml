name: Publish WinGet repository

on:
  repository_dispatch:
    types: [new_package]
  workflow_dispatch:
    inputs:
      repository:
        description: Producer registered in winget/packages.json
        default: house-of-vanity/tsunagi
        required: true
      tag:
        description: Published release tag
        default: v1.0.3
        required: true
  pull_request:
    paths: ['winget/**', '.github/workflows/publish-winget.yml']

concurrency:
  group: winget-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  queue: max

permissions:
  contents: read

jobs:
  catalog:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.repository == 'house-of-vanity/tsunagi'))
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCER: ${{ github.event.client_payload.repository || inputs.repository || (github.event_name == 'pull_request' && 'house-of-vanity/tsunagi') }}
      RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag || (github.event_name == 'pull_request' && 'v1.0.3') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Import release and restore all earlier manifests
        id: release
        run: python winget/catalog.py prepare "$env:RUNNER_TEMP/winget" "$env:PRODUCER" "$env:RELEASE_TAG"
      - name: Build both WinGet indexes
        run: ./winget/build.ps1 "$env:RUNNER_TEMP/winget"
      - name: Sign and verify preview with a disposable certificate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          signing="$(mktemp -d)/preview"
          bash winget/create-signing-key.sh "$signing"
          WINGET_PFX_BASE64="$(openssl base64 -A -in "$signing/hexor-winget.pfx")" \
            WINGET_PFX_PASSWORD="$(cat "$signing/pfx-password")" \
            pwsh -NoProfile -File winget/sign.ps1 "$RUNNER_TEMP/winget"
      - name: Sign and verify release
        if: github.event_name != 'pull_request'
        run: ./winget/sign.ps1 "$env:RUNNER_TEMP/winget"
        env:
          WINGET_PFX_BASE64: ${{ secrets.WINGET_PFX_BASE64 }}
          WINGET_PFX_PASSWORD: ${{ secrets.WINGET_PFX_PASSWORD }}
      - name: Publish installers, manifests and signed indexes
        if: github.event_name != 'pull_request'
        run: python winget/catalog.py publish "$env:RUNNER_TEMP/winget"
      - name: Verify the requested package with WinGet
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ github.event_name != 'pull_request' && 'https://repo.hexor.cy/repos/raw/hexor-winget' || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $source = $env:SOURCE
          if (!$source) { $source = Join-Path $env:RUNNER_TEMP 'winget/cache' }
          winget source add --name hexor --type Microsoft.PreIndexed.Package --arg $source --accept-source-agreements
          winget show --source hexor --id $env:PACKAGE --exact --version $env:VERSION --accept-source-agreements
          if ($env:SOURCE) {
            winget download --source hexor --id $env:PACKAGE --exact --version $env:VERSION --skip-dependencies --accept-package-agreements --accept-source-agreements --download-directory "$env:RUNNER_TEMP/verify"
          }
