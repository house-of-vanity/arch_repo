name: Publish Arch repository

on:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [new_package]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tsunagi release tag to import (empty: reconcile releases)'
        required: false
        type: string
  push:
    branches: [main]

# Serialize the update and deployment, including the repo branch checkout.
# Nightly reconciliation recovers events superseded while pending.
concurrency:
  group: arch-repository
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
      pages: read
    steps:
      - name: Install repository tooling
        run: pacman -Syu --noconfirm git python
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test repository updater
        run: python -m unittest discover -s tests -v
      - name: Checkout published packages
        uses: actions/checkout@v6
        with:
          ref: repo
          path: repository
      - name: Download release packages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: python scripts/sync.py download incoming
      - name: Update pacman databases and directory indexes
        run: python scripts/sync.py update repository incoming
      - name: Save packages in the repo branch
        working-directory: repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- x86_64 aarch64 armv7h index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Update Arch packages and repository databases'
            git push origin HEAD:repo
          fi
      - name: Prepare Pages artifact
        run: python scripts/sync.py site repository site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
