name: Download Artifact and Commit
env:
  REPO_NAME: btwiusearch.net
on:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [new_package]
  push:
    branches:
      - main

jobs:
  download:
    name: Get
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - house-of-vanity/rexec
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - uses: robinraju/release-downloader@v1.8
      id: download
      with:
        repository: ${{ matrix.repo }}
        latest: true
        fileName: "*.zst"
    - name: Get name
      run: echo "PKG_NAME=$(echo ${{ matrix.repo }} | awk -F '/' '{print $NF}')" >> $GITHUB_ENV
    - uses: actions/upload-artifact@master
      if: fromJson(steps.download.outputs.downloaded_files)[0]
      name: Upload artifact
      with:
        name: ${{ env.PKG_NAME }}
        path: "*.zst"
        if-no-files-found: ignore
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    needs:
      - download
    steps:
      - name: Update git
        run: |
          pacman -Syu --noconfirm git
          git config --global --add safe.directory '*'
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: repo
      - uses: actions/download-artifact@master
        name: Download
        id: download
        with:
          path: pkgs/
      - name: Update database
        run: |
          # Create x86_64 directory if it doesn't exist
          mkdir -p x86_64/
          
          # Check if any .zst files were downloaded
          if find pkgs/ -name "*.zst" -type f | head -1 | grep -q .; then
            # Move all .zst files from any subdirectory to x86_64/
            find pkgs/ -name "*.zst" -type f -exec mv {} x86_64/ \;
            
            # Update the repo database
            cd x86_64/
            repo-add --new ${{ env.REPO_NAME }}.db.tar.gz *.zst
            cd ../
            bash update.sh x86_64
          else
            echo "No .zst files found to process"
            # Still create an empty index.html
            bash update.sh x86_64
          fi
      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          new_branch: repo

